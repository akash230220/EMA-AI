# backend/pytest.ini
[pytest]
# ------------------------------------------------------------------------------
# Discovery
# ------------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ------------------------------------------------------------------------------
# Async support — every service/repository function in this codebase is
# async (Motor, Gemini, Gmail/Calendar API calls), and pytest-asyncio's
# "auto" mode lets every `async def test_...` run without needing an
# explicit @pytest.mark.asyncio decorator on each one.
# ------------------------------------------------------------------------------
asyncio_mode = auto

# ------------------------------------------------------------------------------
# Markers — declared explicitly so --strict-markers (below) catches typos
# in @pytest.mark.xxx decorators instead of silently ignoring them.
# ------------------------------------------------------------------------------
markers =
    unit: fast, dependency-free tests (tests/unit/)
    integration: tests exercising the real FastAPI app via TestClient (tests/integration/)
    slow: tests that hit a real external service or take noticeably longer to run

# ------------------------------------------------------------------------------
# Output / behavior
# ------------------------------------------------------------------------------
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --disable-warnings

